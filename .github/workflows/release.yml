# Builds Crate for Windows and Linux on every push to main (including merged pull requests)
# and publishes the binaries as a GitHub release tagged v<Cargo version>-build.<run number>.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One release at a time, in push order.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # Compiled into the program (src/update.rs): it identifies the release for updates.
  CRATE_BUILD: ${{ github.run_number }}
  CRATE_COMMIT: ${{ github.sha }}

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            exe: crate.exe
          - name: linux-x64
            os: ubuntu-latest
            exe: crate
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Unit tests only: the script and CLI tests need a GPU, which hosted runners don't have.
      - name: Unit tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          dir="crate-${version}-${{ matrix.name }}"
          mkdir "$dir"
          cp "target/release/${{ matrix.exe }}" README.md "$dir/"
          cp -r docs "$dir/docs"
          cp -r assets "$dir/assets"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$dir.zip" "$dir" > /dev/null
            echo "ARCHIVE=$dir.zip" >> "$GITHUB_ENV"
          else
            tar czf "$dir.tar.gz" "$dir"
            echo "ARCHIVE=$dir.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ARCHIVE }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "TAG=v${version}-build.${{ github.run_number }}" >> "$GITHUB_ENV"
          echo "TITLE=Crate ${version} (build ${{ github.run_number }})" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          generate_release_notes: true
          make_latest: true
          files: dist/*
          fail_on_unmatched_files: true
